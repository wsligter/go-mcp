name: Deploy Docker to Azure Container Apps

on:
  push:
    branches:
      - azure-functions-deployment
  workflow_dispatch:
    branches:
      - azure-functions-deployment

env:
  REGISTRY_NAME: 'roodhalsmcp'
  IMAGE_NAME: 'mcp-server'
  RESOURCE_GROUP: 'Roodhals-PoC'
  CONTAINER_APP_NAME: 'roodhals-mcp'
  CONTAINER_APP_ENV: 'roodhals-mcp-env'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v4

    - name: 'Login to Azure'
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: 'Build and push image to ACR'
      run: |
        az acr build \
          --registry ${{ env.REGISTRY_NAME }} \
          --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
          --image ${{ env.IMAGE_NAME }}:latest \
          --file Dockerfile .

    - name: 'Deploy to Azure Container Apps'
      run: |
        # Check if container app exists
        if az containerapp show --name ${{ env.CONTAINER_APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} &>/dev/null; then
          # Update existing app
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
        else
          # Create new app
          az containerapp create \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --environment ${{ env.CONTAINER_APP_ENV }} \
            --image ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --target-port 8080 \
            --ingress external \
            --registry-server ${{ env.REGISTRY_NAME }}.azurecr.io
        fi

    - name: 'Get Container App URL'
      run: |
        FQDN=$(az containerapp show \
          --name ${{ env.CONTAINER_APP_NAME }} \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --query properties.configuration.ingress.fqdn \
          --output tsv)
        echo "🚀 Deployed to: https://$FQDN"
